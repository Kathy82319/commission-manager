<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arti 繪師小幫手</title>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          let hasUnregistered = false;
          for (let registration of registrations) {
            registration.unregister();
            hasUnregistered = true;
          }
          if (hasUnregistered && !sessionStorage.getItem('sw_cleared_reload')) {
            sessionStorage.setItem('sw_cleared_reload', 'true');
            window.location.reload(true);
          }
        }).catch(function(err) {
          console.error('Service Worker clear failed:', err);
        });
      }

      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('FetchEvent') || e.message.includes('redirect mode'))) {
          window.location.reload(true);
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
