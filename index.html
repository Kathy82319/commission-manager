<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arti 繪師委託管理系統</title>

    <script>
      // 保留安全的大掃除功能，確保舊快取被註銷
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          let hasUnregistered = false;
          for (let registration of registrations) {
            registration.unregister();
            hasUnregistered = true;
          }
          if (hasUnregistered && !sessionStorage.getItem('sw_cleared_reload')) {
            sessionStorage.setItem('sw_cleared_reload', 'true');
            window.location.reload(true);
          }
        }).catch(function(err) {
          console.error('Service Worker clear failed:', err);
        });
      }

      // 💡 物理移除 window.addEventListener('error') 的重整監聽器
      // 這樣可以徹底阻止火狐與蘋果手機陷入無限重整（F5）死循環
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
